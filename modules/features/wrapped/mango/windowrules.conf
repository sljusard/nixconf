# ===== Satty (screenshots.nix) =====
# screenshot-full-edit: fullscreen overlay on top of the desktop
window_rule=is_fullscreen:1,no_border:1,no_radius:1,no_shadow:1,no_animation:1,app_id:^com\.gabm\.satty\.overlay$
# screenshot-area-edit: plain floating editor window
window_rule=is_floating:1,app_id:^com\.gabm\.satty$
