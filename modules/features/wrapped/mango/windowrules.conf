# ===== Satty (screenshots.nix) =====
# screenshot-edit: fullscreen overlay on top of the desktop
# no_animation alone still leaves the open fade-in and the close animation
window_rule=is_fullscreen:1,no_border:1,no_radius:1,no_shadow:1,no_animation:1,no_fade_in:1,no_fade_out:1,animation_type_open:none,animation_type_close:none,app_id:^com\.gabm\.satty$
